<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign Up</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Create Account</h1>

            <p class="subtitle">
                Sign up to get started
            </p>

            {% with messages = get_flashed_messages() %}
                {% if messages %}

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}
            {% endwith %}


            <form id="signupForm"
                  action="{{ url_for('signup') }}"
                  method="POST">

                <!-- Name -->

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required
                    >

                    <small id="nameError"></small>

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <small id="emailError"></small>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            required
                        >

                        <button
                            type="button"
                            onclick="togglePassword('password')"
                        >
                            👁
                        </button>

                    </div>

                    <small id="passwordError"></small>

                </div>


                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required
                        >

                        <button
                            type="button"
                            onclick="togglePassword('confirmPassword')"
                        >
                            👁
                        </button>

                    </div>

                    <small id="confirmPasswordError"></small>

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Sign Up
                </button>

            </form>


            <p class="switch-page">

                Already have an account?

                <a href="{{ url_for('signin') }}">
                    Sign In
                </a>

            </p>

        </div>

    </div>


    <script src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
