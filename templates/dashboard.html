<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

    <div class="dashboard">

        <div class="dashboard-card">

            <h1>
                Welcome, {{ name }} 👋
            </h1>

            <p>
                You are successfully logged in.
            </p>

            <p>
                Email:
                <strong>{{ email }}</strong>
            </p>

            <a
                href="{{ url_for('logout') }}"
                class="logout-btn"
            >
                Logout
            </a>

        </div>

    </div>

</body>

</html>
