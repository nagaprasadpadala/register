<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign In</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Sign in to your account
            </p>


            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <form
                id="signinForm"
                action="{{ url_for('signin') }}"
                method="POST"
            >

                <!-- Email -->

                <div class="form-group">

                    <label for="signinEmail">
                        Email
                    </label>

                    <input
                        type="email"
                        id="signinEmail"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                    <small id="signinEmailError"></small>

                </div>


                <!-- Password -->

                <div class="form-group">

                    <label for="signinPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="signinPassword"
                            name="password"
                            placeholder="Enter password"
                            required
                        >

                        <button
                            type="button"
                            onclick="togglePassword('signinPassword')"
                        >
                            👁
                        </button>

                    </div>

                    <small id="signinPasswordError"></small>

                </div>


                <button
                    type="submit"
                    class="btn"
                >
                    Sign In
                </button>

            </form>


            <p class="switch-page">

                Don't have an account?

                <a href="{{ url_for('signup') }}">
                    Create Account
                </a>

            </p>

        </div>

    </div>


    <script src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
